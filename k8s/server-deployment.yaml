apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: meridian
spec:
  # Pinned to 1 — not a placeholder to bump later without other changes.
  # server/src/store.ts's live state is in-process memory (`let state`),
  # and server/src/sim.ts's tick runs on every replica independently with
  # no leader election or distributed lock; a second replica would run its
  # own divergent simulation, double-write Postgres every tick, and give
  # different WebSocket clients different live pictures depending which
  # pod they land on. Scaling this tier for real needs the tick/state
  # ownership moved out of the process first (e.g. one elected leader
  # ticking + persisting, others read-only) — out of scope for this pass.
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: meridian-server:latest # replace with your registry path + a pinned tag
          ports:
            - containerPort: 8799
          envFrom:
            - configMapRef:
                name: meridian-config
            - secretRef:
                name: meridian-secrets
          # /healthz (server/src/index.ts) has no DB/GeoServer/Kafka
          # dependency — liveness only checks the process itself is
          # responsive, so a slow/unreachable Postgres doesn't trigger a
          # kill-and-restart loop that can't fix the actual problem.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8799
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8799
            initialDelaySeconds: 5
            periodSeconds: 10
          # Starting points, not measured values — tune from real usage.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: meridian
spec:
  selector:
    app: server
  ports:
    - port: 8799
      targetPort: 8799
