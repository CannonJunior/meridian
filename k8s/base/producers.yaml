# Three independent long-running producers (kafka/producer,
# kafka/producer-gdelt, kafka/producer-celestrak) — each a single-replica
# Deployment, not a Job/CronJob (see k8s/README.md's table for why), and
# each only reads the subset of meridian-config's keys it cares about (see
# configmap.yaml's comments) — the rest are harmlessly unused per pod. No
# Service: these don't accept inbound traffic, they only publish to Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-sim
  namespace: meridian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-sim
  template:
    metadata:
      labels:
        app: history-sim
    spec:
      # See server-deployment.yaml's imagePullSecrets comment — same setup.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: history-sim
          image: ghcr.io/cannonjunior/meridian-history-sim:latest # built/pushed by .github/workflows/ci.yml
          envFrom:
            - configMapRef:
                name: meridian-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
