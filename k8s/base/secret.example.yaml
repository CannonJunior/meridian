# Template, not a real Secret — same convention as .env.example elsewhere
# in this repo. Copy to secret.yaml (already gitignored, see k8s/README.md),
# fill in real values, `kubectl apply -f k8s/secret.yaml`. Never commit the
# filled-in copy. For anything beyond a personal/dev cluster, prefer a real
# secret manager over a plain Secret object (base64 is not encryption).
apiVersion: v1
kind: Secret
metadata:
  name: meridian-secrets
  namespace: meridian
type: Opaque
stringData:
  PGPASSWORD: "change-me"
  GOOGLE_MAPS_API_KEY: ""
  # geoserver-deployment.yaml only — server never authenticates to
  # GeoServer's admin API, just its unauthenticated WFS endpoint.
  GEOSERVER_ADMIN_PASSWORD: "change-me"
