apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: meridian
spec:
  # Stateless static content + reverse proxy (web/nginx.conf.template) —
  # safe to scale, unlike `server` (see server-deployment.yaml).
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # See server-deployment.yaml's imagePullSecrets comment — same setup.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # Built and pushed by .github/workflows/ci.yml on every push to
          # main — see server-deployment.yaml's image comment.
          image: ghcr.io/cannonjunior/meridian-web:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: meridian-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: meridian
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# Requires the metrics-server addon (present on most managed clusters;
# `minikube addons enable metrics-server` / not installed by plain kind).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: meridian
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Keeps at least one `web` pod up through a voluntary disruption (node
# drain, cluster upgrade) — meaningless at minReplicas: 1, which is
# exactly why `server` (server-deployment.yaml) doesn't get one.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: meridian
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
