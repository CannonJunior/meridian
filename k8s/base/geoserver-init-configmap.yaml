# Generated snapshot of geoserver/geoserver-init/provision.sh + its *.sld
# files — NOT hand-maintained. Regenerate whenever provision.sh or any SLD
# under geoserver/geoserver-init/ changes, from the repo root:
#
#   kubectl create configmap geoserver-init -n meridian \
#     --from-file=geoserver/geoserver-init/provision.sh \
#     --from-file=geoserver/geoserver-init/ports_style.sld \
#     --from-file=geoserver/geoserver-init/airfields_style.sld \
#     --from-file=geoserver/geoserver-init/eez_style.sld \
#     --from-file=geoserver/geoserver-init/shipping_lanes_style.sld \
#     --from-file=geoserver/geoserver-init/submarine_cables_style.sld \
#     --from-file=geoserver/geoserver-init/bathymetry_style.sld \
#     --from-file=geoserver/geoserver-init/drawn_shapes_style.sld \
#     --from-file=geoserver/geoserver-init/live_point_style.sld \
#     --from-file=geoserver/geoserver-init/nais_style.sld \
#     --from-file=geoserver/geoserver-init/history_style.sld \
#     --dry-run=client -o yaml > k8s/geoserver-init-configmap.yaml
#
# A kustomize configMapGenerator would auto-track these files instead, but
# its default load restrictions block referencing paths outside k8s/'s own
# directory tree under plain `kubectl apply -k` — not worth the friction
# for a ConfigMap that only changes when someone deliberately edits a
# style or the provisioning script.
apiVersion: v1
data:
  airfields_style.sld: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- GENERATED by generate_slds.py from web/src/assets/layerColors.json — do not hand-edit; edit that JSON and re-run the script instead. -->
    <StyledLayerDescriptor version="1.0.0"
      xmlns="http://www.opengis.net/sld" xmlns:ogc="http://www.opengis.net/ogc"
      xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.opengis.net/sld http://schemas.opengis.net/sld/1.0.0/StyledLayerDescriptor.xsd">
      <NamedLayer>
        <Name>airfields</Name>
        <UserStyle>
          <Title>Airfields</Title>
          <FeatureTypeStyle>
            <Rule>
              <Name>boundary</Name>
              <ogc:Filter><ogc:PropertyIsEqualTo><ogc:PropertyName>kind</ogc:PropertyName><ogc:Literal>boundary</ogc:Literal></ogc:PropertyIsEqualTo></ogc:Filter>
              <PolygonSymbolizer>
                <Fill><CssParameter name="fill">#ffab38</CssParameter><CssParameter name="fill-opacity">0.06</CssParameter></Fill>
                <Stroke><CssParameter name="stroke">#ffab38</CssParameter><CssParameter name="stroke-width">1.2</CssParameter></Stroke>
              </PolygonSymbolizer>
            </Rule>
            <Rule>
              <Name>runway</Name>
              <ogc:Filter><ogc:PropertyIsEqualTo><ogc:PropertyName>kind</ogc:PropertyName><ogc:Literal>runway</ogc:Literal></ogc:PropertyIsEqualTo></ogc:Filter>
              <PolygonSymbolizer>
                <Fill><CssParameter name="fill">#cdd9d7</CssParameter><CssParameter name="fill-opacity">0.85</CssParameter></Fill>
                <Stroke><CssParameter name="stroke">#06090a</CssParameter><CssParameter name="stroke-width">0.4</CssParameter></Stroke>
              </PolygonSymbolizer>
            </Rule>
            <Rule>
              <Name>taxiway</Name>
              <ogc:Filter><ogc:PropertyIsEqualTo><ogc:PropertyName>kind</ogc:PropertyName><ogc:Literal>taxiway</ogc:Literal></ogc:PropertyIsEqualTo></ogc:Filter>
              <PolygonSymbolizer>
                <Fill><CssParameter name="fill">#9fb2ae</CssParameter><CssParameter name="fill-opacity">0.7</CssParameter></Fill>
                <Stroke><CssParameter name="stroke">#06090a</CssParameter><CssParameter name="stroke-width">0.4</CssParameter></Stroke>
              </PolygonSymbolizer>
            </Rule>
          </FeatureTypeStyle>
        </UserStyle>
      </NamedLayer>
    </StyledLayerDescriptor>
  bathymetry_style.sld: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- GENERATED by generate_slds.py from web/src/assets/layerColors.json — do not hand-edit; edit that JSON and re-run the script instead. -->
    <StyledLayerDescriptor version="1.0.0"
      xmlns="http://www.opengis.net/sld" xmlns:ogc="http://www.opengis.net/ogc"
      xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.opengis.net/sld http://schemas.opengis.net/sld/1.0.0/StyledLayerDescriptor.xsd">
      <NamedLayer>
        <Name>bathymetry_contours</Name>
        <UserStyle>
          <Title>Bathymetry Contours</Title>
          <FeatureTypeStyle>
            <Rule>
              <Name>shallow</Name>
              <ogc:Filter><ogc:PropertyIsLessThan><ogc:PropertyName>depth_m</ogc:PropertyName><ogc:Literal>200</ogc:Literal></ogc:PropertyIsLessThan></ogc:Filter>
              <LineSymbolizer>
                <Stroke><CssParameter name="stroke">#2e6fa8</CssParameter><CssParameter name="stroke-width">0.5</CssParameter><CssParameter name="stroke-opacity">0.5</CssParameter></Stroke>
              </LineSymbolizer>
            </Rule>
            <Rule>
              <Name>mid</Name>
              <ogc:Filter>
                <ogc:And>
                  <ogc:PropertyIsGreaterThanOrEqualTo><ogc:PropertyName>depth_m</ogc:PropertyName><ogc:Literal>200</ogc:Literal></ogc:PropertyIsGreaterThanOrEqualTo>
                  <ogc:PropertyIsLessThan><ogc:PropertyName>depth_m</ogc:PropertyName><ogc:Literal>1000</ogc:Literal></ogc:PropertyIsLessThan>
                </ogc:And>
              </ogc:Filter>
              <LineSymbolizer>
                <Stroke><CssParameter name="stroke">#2467a0</CssParameter><CssParameter name="stroke-width">0.7</CssParameter><CssParameter name="stroke-opacity">0.65</CssParameter></Stroke>
              </LineSymbolizer>
            </Rule>
            <Rule>
              <Name>deep</Name>
              <ogc:Filter><ogc:PropertyIsGreaterThanOrEqualTo><ogc:PropertyName>depth_m</ogc:PropertyName><ogc:Literal>1000</ogc:Literal></ogc:PropertyIsGreaterThanOrEqualTo></ogc:Filter>
              <LineSymbolizer>
                <Stroke><CssParameter name="stroke">#173f66</CssParameter><CssParameter name="stroke-width">0.9</CssParameter><CssParameter name="stroke-opacity">0.8</CssParameter></Stroke>
              </LineSymbolizer>
            </Rule>
          </FeatureTypeStyle>
        </UserStyle>
      </NamedLayer>
    </StyledLayerDescriptor>
