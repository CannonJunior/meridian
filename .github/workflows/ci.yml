name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, test, lint, build (server + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # server/web are npm workspaces sharing this one root lockfile — see
      # server/Dockerfile's header comment for the same constraint on the
      # container build side.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w server
      - run: npm run lint -w web
      - run: npm run build

  kafka-producers:
    name: Typecheck Kafka producer (${{ matrix.producer }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Not npm workspaces (see kafka/producer/package.json) — each has
        # its own lockfile and is installed/checked independently.
        producer: [producer, producer-gdelt, producer-celestrak]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kafka/${{ matrix.producer }}/package-lock.json
      - run: npm ci
        working-directory: kafka/${{ matrix.producer }}
      - run: npm run typecheck
        working-directory: kafka/${{ matrix.producer }}

  k8s-smoke-test:
    name: k8s smoke test (kind + Calico)
    runs-on: ubuntu-latest
    needs: [app, kafka-producers]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -sSL -o kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Install kind
        run: |
          curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/
      # Docker is preinstalled on GitHub's ubuntu-latest runners — nothing
      # else to set up. See .github/scripts/k8s-smoke-test.sh's own header
      # for exactly what this does and doesn't cover.
      - run: ./.github/scripts/k8s-smoke-test.sh

  docker-build:
    name: Build (and push, on main) container images
    runs-on: ubuntu-latest
    needs: [app, kafka-producers]
    # Only the push step needs this — GITHUB_TOKEN is otherwise read-only.
    permissions:
      contents: read
      packages: write
    env:
      # ghcr.io requires a lowercase path; github.repository_owner
      # ("CannonJunior") isn't, so it's hardcoded rather than interpolated.
      REGISTRY: ghcr.io/cannonjunior/meridian
      # Every PR still builds every image (catches a broken Dockerfile
      # before merge) — only a push to main actually publishes anything,
      # so a PR from a fork can't push under this repo's package namespace.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged :latest (what k8s/*.yaml's placeholders point at today) and
      # :<sha> (what to actually pin a Deployment's `image:` to once
      # there's a release process — :latest is a moving target, fine for
      # this pilot, not for a real rollout).
      - name: Build/push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}-server:latest
            ${{ env.REGISTRY }}-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build/push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}-web:latest
            ${{ env.REGISTRY }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build/push Kafka producer images
        run: |
          set -e
          # kafka/<dir> -> the k8s/producers.yaml image name it corresponds to.
          declare -A IMAGE_FOR=(
            [producer]=history-sim
            [producer-gdelt]=history-gdelt
            [producer-celestrak]=history-celestrak
          )
          for dir in "${!IMAGE_FOR[@]}"; do
            image="${REGISTRY}-${IMAGE_FOR[$dir]}"
            docker build -t "${image}:latest" -t "${image}:${GITHUB_SHA}" "kafka/$dir"
            if [ "$PUSH" = "true" ]; then
              docker push "${image}:latest"
              docker push "${image}:${GITHUB_SHA}"
            fi
          done
