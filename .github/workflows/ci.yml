name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, test, lint, build (server + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # server/web are npm workspaces sharing this one root lockfile — see
      # server/Dockerfile's header comment for the same constraint on the
      # container build side.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w server
      - run: npm run lint -w web
      - run: npm run build

  kafka-producers:
    name: Typecheck Kafka producer (${{ matrix.producer }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Not npm workspaces (see kafka/producer/package.json) — each has
        # its own lockfile and is installed/checked independently.
        producer: [producer, producer-gdelt, producer-celestrak]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kafka/${{ matrix.producer }}/package-lock.json
      - run: npm ci
        working-directory: kafka/${{ matrix.producer }}
      - run: npm run typecheck
        working-directory: kafka/${{ matrix.producer }}

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [app, kafka-producers]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only — validates every Dockerfile still produces a working
      # image on every push. No registry is wired up yet (push: false); add
      # a push step once one is chosen (ECR/GHCR/...), which is also the
      # point a first real deployment target — k8s or otherwise — needs.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: meridian-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: meridian-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build Kafka producer images
        run: |
          set -e
          for d in producer producer-gdelt producer-celestrak; do
            docker build -t "meridian-$d:ci" "kafka/$d"
          done
