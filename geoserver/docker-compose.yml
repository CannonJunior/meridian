name: meridian-geo

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: meridian-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # Mounted as individual files (not the whole dir) so the postgis image's
      # own /docker-entrypoint-initdb.d/10_postgis.sh (creates the postgis
      # extension) isn't shadowed. Ours is named to sort after it.
      - ./postgis-init/20-ports.sql:/docker-entrypoint-initdb.d/20-ports.sql:ro
      - ./postgis-init/30-airfields.sql:/docker-entrypoint-initdb.d/30-airfields.sql:ro
      - ./postgis-init/40-eez.sql:/docker-entrypoint-initdb.d/40-eez.sql:ro
      - ./postgis-init/50-shipping-lanes.sql:/docker-entrypoint-initdb.d/50-shipping-lanes.sql:ro
      - ./postgis-init/60-submarine-cables.sql:/docker-entrypoint-initdb.d/60-submarine-cables.sql:ro
      - ./postgis-init/70-bathymetry.sql:/docker-entrypoint-initdb.d/70-bathymetry.sql:ro
      - ./postgis-init/80-live-entities.sql:/docker-entrypoint-initdb.d/80-live-entities.sql:ro
      - ./postgis-init/90-live-entities-triggers.sql:/docker-entrypoint-initdb.d/90-live-entities-triggers.sql:ro
      - ./postgis-init/95-drawn-shapes.sql:/docker-entrypoint-initdb.d/95-drawn-shapes.sql:ro
    ports:
      - "${POSTGIS_PORT:-5555}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 5s
      timeout: 5s
      retries: 20

  geoserver:
    image: kartoza/geoserver:latest
    container_name: meridian-geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-meridian}
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      # kartoza/geoserver defaults to -Xms2G -Xmx4G (see its
      # /scripts/lib/env-data.sh) regardless of what's actually being
      # served — generous for a production tile-serving deployment, way
      # more than this single-tenant dev instance needs for a handful of
      # small vector layers (ports/airfields/EEZ/shipping-lanes/cables/
      # bathymetry/live-entities/drawn-shapes). Capped down so it isn't
      # reserving multiple GB of heap it'll never use, stacked alongside
      # Kafka's own JVM and everything else `npm run dev` + `geo:up` +
      # `kafka:up` already run concurrently on the same dev machine.
      INITIAL_MEMORY: ${GEOSERVER_INITIAL_MEMORY:-512M}
      MAXIMUM_MEMORY: ${GEOSERVER_MAXIMUM_MEMORY:-1G}
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    ports:
      - "${GEOSERVER_PORT:-8600}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  geoserver-init:
    image: curlimages/curl:8.10.1
    container_name: meridian-geoserver-init
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-meridian}
      POSTGIS_HOST: postgis
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
    volumes:
      - ./geoserver-init:/init:ro
    entrypoint: ["/bin/sh", "/init/provision.sh"]
    restart: "no"

volumes:
  postgis-data:
  geoserver-data:
